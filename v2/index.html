<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F2EC">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>TaskTracker v2</title>
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png?v=3">
<link rel="icon" href="../icons/icon-192.png?v=3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/finclasica.css?v=202611041208">
<link rel="stylesheet" href="css/theme.css?v=202611041208">
<!-- v2 no registra service worker por ahora (plan v2) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script type="module" src="js/app.js?v=202611041208"></script>
</head>
<body>

<div class="login" id="login" hidden>
  <form class="login-card" id="loginForm" autocomplete="on">
    <h1>TaskTracker</h1>
    <p id="loginHint">Entra con tu contraseña o pide un enlace a tu correo.</p>
    <div id="loginEmailStep" style="display:flex;flex-direction:column;gap:10px">
      <label class="sr-only" for="loginEmail">Correo</label>
      <input class="field" id="loginEmail" type="email" placeholder="tu@correo.com" required autocomplete="email" inputmode="email">
      <label class="sr-only" for="loginPassword">Contraseña</label>
      <input class="field" id="loginPassword" type="password" placeholder="Contraseña" autocomplete="current-password">
      <button class="btn-primary" type="submit" id="loginPwBtn">Entrar</button>
      <button class="btn-ghost" type="button" id="loginLinkBtn">Enviarme un enlace</button>
    </div>
    <div id="loginCodeStep" hidden style="display:flex;flex-direction:column;gap:10px">
      <label class="sr-only" for="loginCode">Código</label>
      <input class="field" id="loginCode" type="text" placeholder="Código de 6 dígitos" inputmode="numeric" autocomplete="one-time-code" maxlength="10">
      <button class="btn-primary" type="button" id="loginCodeBtn">Entrar con código</button>
      <button class="btn-link" type="button" id="loginBack">Usar otro correo</button>
    </div>
    <div class="login-msg" id="loginMsg" aria-live="polite"></div>
  </form>
</div>

<div class="shell" id="app" hidden>
  <nav class="side" aria-label="Secciones">
    <div class="brand"><span class="brand-mark" aria-hidden="true">T</span>TaskTracker</div>
      <a class="side-link" href="#inicio" data-route="inicio"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
      <a class="side-link" href="#tareas" data-route="tareas"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Tareas<span class="side-count" id="sideTaskCount"></span></a>
      <a class="side-link" href="#calendario" data-route="calendario"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>Calendario</a>
      <a class="side-link" href="#finanzas" data-route="finanzas"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Finanzas</a>
      <a class="side-link" href="#salud" data-route="salud"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg>Salud</a>
      <a class="side-link" href="#objetivos" data-route="objetivos"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Objetivos y hábitos</a>
      <a class="side-link" href="#recordatorios" data-route="recordatorios"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>Recordatorios</a>
      <a class="side-link" href="#notas" data-route="notas"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6M8 13h8M8 17h5"/></svg>Notas</a>
      <a class="side-link" href="#estadisticas" data-route="estadisticas"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Estadísticas</a>
    <div class="side-foot">
      <button class="side-link" type="button" data-logout><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H4"/></svg>Cerrar sesión</button>
    </div>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
  <nav class="tabbar" aria-label="Navegación principal">
    <a class="tab" href="#inicio" data-route="inicio"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
    <a class="tab" href="#tareas" data-route="tareas"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Tareas</a>
    <a class="tab" href="#finanzas" data-route="finanzas"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20M6 15h4"/></svg>Finanzas</a>
    <a class="tab" href="#salud" data-route="salud"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8L12 21l8.8-8.6a5.5 5.5 0 0 0 0-7.8z"/></svg>Salud</a>
    <a class="tab" href="#mas" data-route="mas"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>Más</a>
  </nav>
</div>

<dialog class="modal" id="modal" aria-label="Ventana"></dialog>
<div class="toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
